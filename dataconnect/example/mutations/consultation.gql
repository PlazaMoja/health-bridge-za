# Talk to a Doctor > Request a consultation
mutation InsertConsultationRequest(
  $patientId: UUID!
  $healthcareWorkerId: UUID!
  $reason: String!
  $preferredDate: Date!
  $preferredTime: String!
  $mode: String!
) @auth(level: USER) {
  consultationRequest_insert(
    data: {
      patientId: $patientId
      healthcareWorkerId: $healthcareWorkerId
      reason: $reason
      preferredDate: $preferredDate
      preferredTime: $preferredTime
      mode: $mode
      status: "requested"
      createdAt_expr: "request.time"
    }
  )
}

# My consultations > Cancel (only offered while it is still requested)
mutation CancelConsultationRequest($id: UUID!) @auth(level: USER) {
  consultationRequest_update(
    id: $id
    data: { status: "cancelled", updatedAt_expr: "request.time" }
  )
}
