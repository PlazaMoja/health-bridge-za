type User @table {
  firebaseUid: String! @unique
  email: String!
  firstName: String!
  lastName: String!
  phoneNumber: String
  role: String!
  createdAt: Timestamp
  updatedAt: Timestamp
}

type Clinic @table {
  name: String!
  province: String!
  municipality: String!
  isActive: Boolean!
  address: String
  latitude: Float
  longitude: Float
  phoneNumber: String
  openingTime: String
  closingTime: String
  createdAt: Timestamp
  updatedAt: Timestamp
}

type HealthcareWorker @table {
  user: User!
  clinic: Clinic!
  profession: String
  specialization: String
  isActive: Boolean
  createdAt: Timestamp
  updatedAt: Timestamp
}

type Patient @table {
  user: User!
  preferredClinic: Clinic
  dateOfBirth: Date
  gender: String
  address: String
  emergencyContactName: String
  emergencyContactPhone: String
  createdAt: Timestamp
  updatedAt: Timestamp
}

type Service @table {
  clinic: Clinic!
  name: String!
  createdAt: Timestamp
  updatedAt: Timestamp
}

type Appointment @table {
  patient: Patient!
  clinic: Clinic!
  service: Service!
  appointmentDate: Date!
  startTime: String!
  endTime: String
  healthcareWorker: HealthcareWorker
  status: String
  reason: String
  cancellationReason: String
  createdAt: Timestamp
  updatedAt: Timestamp
}

type MedicalRecord @table {
  patient: Patient!
  clinic: Clinic!
  healthcareWorker: HealthcareWorker!
  visitDate: Date!
  appointment: Appointment
  diagnosis: String
  notes: String
  createdAt: Timestamp
  updatedAt: Timestamp
}

# ---------- Profile > Notifications / Settings ----------
# One row per user, created the first time they open Settings or Notifications.
type Preference @table {
  user: User!
  themeMode: String              # "system", "light", "dark"
  textSize: String               # "small", "normal", "large"
  appointmentReminders: Boolean
  reminderTime: String           # "15min", "1hour", "1day"
  medicationReminders: Boolean
  healthTips: Boolean
  promotions: Boolean
  shareDataForResearch: Boolean
  createdAt: Timestamp
  updatedAt: Timestamp
}

# ---------- Order Medication ----------
type Medication @table {
  name: String!
  type: String                   # e.g. "Pain and fever relief"
  category: String!              # e.g. "Headache & Pain"
  price: Float!                  # rand
  isActive: Boolean!
  sortOrder: Int
  createdAt: Timestamp
  updatedAt: Timestamp
}

type MedicationOrder @table {
  patient: Patient!
  fulfilment: String!            # "collect" or "delivery"
  clinic: Clinic                 # set when collecting
  deliveryAddress: String        # set when delivering
  notes: String
  subtotal: Float!
  deliveryFee: Float!
  total: Float!
  status: String!                # "pending", "ready", "completed", "cancelled"
  createdAt: Timestamp
  updatedAt: Timestamp
}

# Name and price are copied in when ordering so later price changes
# don't change old orders.
type MedicationOrderItem @table {
  order: MedicationOrder!
  medication: Medication!
  name: String!
  quantity: Int!
  unitPrice: Float!
  lineTotal: Float!
}
