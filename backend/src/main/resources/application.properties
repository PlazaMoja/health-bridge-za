spring.application.name=health-bridge-backend
server.port=8080

# Path to the Firebase admin (service account) JSON key.
# If this file isn't found, the app also looks for any "*firebase-adminsdk*.json"
# in the backend folder, so you can drop the key in without renaming it.
# The key is listed in .gitignore - never commit it.
firebase.credentials-path=serviceAccountKey.json

# Fill Firestore with the starter clinics, doctors and medications
# the first time the app runs (only if those collections are empty).
app.seed-data=true
